# ===== إعدادات Jekyll لموقع «عالم تقني» =====
title: "عالم تقني"
description: "منصة تقدّم خدمات تقنية وبرمجية متعددة: تطبيقات، شروحات، مقالات تقنية، وأدوات عصرية."
author: "عاصم محمد"
lang: ar
dir: rtl

# ===== الرابط الأساسي (GitHub Pages — يُبنى تلقائياً مع كل push) =====
url: "https://abw002050-lgtm.github.io"
baseurl: "/3alam-tech"

# رابط Netlify (يُستخدم عند توفر رصيد النشر؛ انظر netlify.toml)
netlify_url: "https://3alam-tech.netlify.app"
github_pages_url: "https://abw002050-lgtm.github.io/3alam-tech"

# معلومات التواصل
whatsapp: "00967735383729"
location: "اليمن"
github_repo: "https://github.com/abw002050-lgtm/3alam-tech"

# محرك Markdown
markdown: kramdown
highlighter: rouge

# روابط نظيفة للمقالات
permalink: /shuroohat/:year/:month/:day/:title:output_ext

# ===== نشر المقالات ذات التواريخ المستقبلية =====
# التواريخ هنا تُحدَّد يدويًا وتُحترم كما هي في الرابط النهائي.
# بدون هذا الخيار يتخطّى Jekyll أي مقال تاريخه بعد وقت البناء،
# فتختفي المقالات الجديدة من الخريطة والصفحات.
future: true

# الإضافات المسموحة على GitHub Pages
plugins:
  - jekyll-sitemap
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-redirect-from

# ===== المجموعات (Collections) =====
collections:
  projects:
    output: true
    permalink: /tawabeek/:name/

# ===== الإعدادات الافتراضية للصفحات =====
defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
  - scope:
      path: ""
      type: "projects"
    values:
      layout: "project"
  - scope:
      path: ""
    values:
      layout: "default"

# استبعاد الملفات غير الضرورية
exclude:
  - _config_netlify.yml
  - Gemfile
  - Gemfile.lock
  - README.md
  - node_modules
  - .gitignore
  - vendor
