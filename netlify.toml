[build]
  command = "bundle exec jekyll build --baseurl ''"
  publish = "_site"

[build.environment]
  JEKYLL_ENV = "production"
  RUBY_VERSION = "3.2.2"

# رؤوس أمان + SEO إضافية
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdnjs.cloudflare.com; font-src 'self' https://fonts.gstatic.com https://cdnjs.cloudflare.com; img-src 'self' data: https:; connect-src 'self'; frame-ancestors 'none'"
    X-XSS-Protection = "1; mode=block"
    # تحسين SEO: تخزين مؤقت ذكي
    Cache-Control = "public, max-age=3600"

# تخزين مؤقت طويل للملفات الثابتة (CSS, JS, الصور)
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# تخزين مؤقت طويل لخطوط Google
[[headers]]
  for = "https://fonts.gstatic.com/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
